<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebXR AR (ARCore)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene
    webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #overlay"
    renderer="alpha: true"
    ar-hit-test>

    <a-entity id="reticle" visible="false">
      <a-ring rotation="-90 0 0" radius-inner="0.08" radius-outer="0.1" color="#00ff00"></a-ring>
    </a-entity>

    <a-entity id="objects"></a-entity>
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="1 3 2" intensity="0.8"></a-light>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="overlay" style="position:fixed;top:10px;left:10px;color:#fff;font:16px sans-serif;
       background:rgba(0,0,0,.6);padding:8px 12px;border-radius:8px;">
    "AR" tugmasini bosing, polga qarating, ekranga bosing
  </div>

  <script>
    AFRAME.registerComponent('ar-hit-test', {
      init: function () {
        var self = this, scene = this.el, reticle = document.getElementById('reticle');
        this.hitSource = null; this.lastPose = null;

        scene.addEventListener('enter-vr', function () {
          if (!scene.is('ar-mode')) return;
          var session = scene.renderer.xr.getSession();
          session.requestReferenceSpace('viewer').then(function (viewerSpace) {
            session.requestHitTestSource({ space: viewerSpace }).then(function (src) {
              self.hitSource = src;
            });
          });
          session.addEventListener('select', function () {
            if (!self.lastPose) return;
            var p = self.lastPose.transform.position;
            var box = document.createElement('a-box');
            box.setAttribute('position', p.x + ' ' + (p.y + 0.1) + ' ' + p.z);
            box.setAttribute('width', 0.2); box.setAttribute('height', 0.2); box.setAttribute('depth', 0.2);
            box.setAttribute('color', '#2196F3');
            document.getElementById('objects').appendChild(box);
          });
        });
      },
      tick: function () {
        var scene = this.el, reticle = document.getElementById('reticle');
        if (!this.hitSource || !scene.frame) return;
        var refSpace = scene.renderer.xr.getReferenceSpace();
        var hits = scene.frame.getHitTestResults(this.hitSource);
        if (hits.length) {
          var pose = hits[0].getPose(refSpace);
          this.lastPose = pose;
          reticle.setAttribute('visible', true);
          reticle.object3D.position.copy(pose.transform.position);
        } else { reticle.setAttribute('visible', false); }
      }
    });
  </script>
</body>
</html>
